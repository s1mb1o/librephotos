[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "librephotos-mcp"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["mcp==2.3.0", "httpx==0.28.1", "PyJWT[crypto]==2.15.1"]

[project.scripts]
librephotos-mcp = "librephotos_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
required-version = "==0.15.22"
line-length = 100

[tool.ruff.lint]
extend-select = ["I", "UP", "ANN", "G"]

[tool.mypy]
python_version = "3.13"
strict = true
